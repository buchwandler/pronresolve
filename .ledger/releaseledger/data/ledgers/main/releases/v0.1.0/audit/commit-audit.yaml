    observed_behavior:
      "Adds the first usable package implementation: dictionary-entry
      discovery groups normalized spelling and part of speech, creates stable reading
      profiles with lexical evidence, persists JSON indexes, and resolves target tokens
      from sentence context with conservative scoring. The CLI exposes build, inspect,
      and validate operations, with tests covering discovery, resolution, and storage
      behavior."
