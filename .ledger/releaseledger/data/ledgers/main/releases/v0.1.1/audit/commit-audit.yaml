    observed_behavior:
      Runtime indexes are now emitted as compact deterministic schema-v2
      JSON, with normalized words grouped by part of speech and readings carrying scalar
      IPA, sense IDs, and precompiled weighted lexical cues. The loader retains schema-v1
      compatibility by compiling legacy evidence into the new cue model; examples and
      etymology numbers are excluded from runtime scoring. Resolver selection now uses
      precompiled cues, supports optional word-specific CLI inspection, and exposes
      matched evidence terms and sense IDs. Documentation and tests cover the new format,
      compatibility, validation, and scoring behavior.
