    observed_behavior: >-
      Makes discovery output deterministic across evidence order, reports entries
      skipped for missing part of speech, and adds strict schema validation for
      indexes and reading profiles. It expands CLI and model validation tests,
      adds Sphinx user and API documentation, and integrates warning-as-error
      documentation builds into CI.
