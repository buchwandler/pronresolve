name: Run tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  run:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and development tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Build distribution
        run: python -m build
      - name: Run tests
        if: runner.os != 'Windows'
        run: python -m pytest
      - name: Run tests on Windows
        if: runner.os == 'Windows'
        timeout-minutes: 60
        env:
          PYTHONFAULTHANDLER: "1"
        run: python -X faulthandler -m pytest -vv
      - name: Run quality checks
        if: runner.os == 'ubuntu-latest' && matrix.python-version == '3.10'
        run: |
          python -m ruff check .
          python -m ruff format --check .
          python -m mypy pronresolve

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install docs dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[docs]"
      - name: Build documentation (warnings are errors)
        run: python -m sphinx -W --keep-going -b html docs docs/_build/html
